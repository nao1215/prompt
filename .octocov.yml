# generated by octocov init
coverage:
  if: true
  # The package is at 99.0% with example/ and terminal.go (the real terminal,
  # which needs one to run) left out. A pull request may not lower it, and the
  # total may not fall below 99%: an uncovered statement is one no test can
  # catch a mutant in either.
  acceptable: current >= 99% && diff >= 0%
  exclude:
    - "**/example/**"
    - "**/mock.go"
    - "**/terminal.go"
diff:
  datastores:
    - artifact://${GITHUB_REPOSITORY}
comment:
  if: is_pull_request
  hideFooterLink: false
summary:
  if: true
report:
  if: is_default_branch
  datastores:
    - artifact://${GITHUB_REPOSITORY}
