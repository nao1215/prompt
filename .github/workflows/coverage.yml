name: Coverage

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit_test:
    name: Unit test (linux)

    # octocov reads and writes the Actions-artifact datastore (report/diff in
    # .octocov.yml) and comments coverage on pull requests, so the job grants
    # those scopes explicitly; the rest of the workflow stays read-only.
    permissions:
      contents: read
      actions: write
      pull-requests: write

    strategy:
      matrix:
        platform: [ubuntu-latest]

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
          check-latest: true

      - name: Run tests with coverage report output
        run: go test -cover -coverpkg=./... -coverprofile=coverage.out ./...

      - uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1.5.2
