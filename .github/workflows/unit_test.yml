name: MultiPlatformUnitTest

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel the superseded run of a pull request when it is pushed again. Every
# other run (push, schedule, manual) is its own group, so none is ever canceled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit_test:
    name: Unit test

    strategy:
      matrix:
        os:
          - "ubuntu-latest"
          - "windows-latest"
          - "macos-latest"
        # The floor go.mod declares and the newest release. prompt is a library
        # (sqly builds on it), so the floor is a promise to its callers and this
        # matrix is the only place it is checked. "stable" tracks each Go
        # release without an edit, and is used rather than "1" because setup-go
        # resolves "1" from its own manifest, which lags a fresh release.
        go:
          - "1.26"
          - "stable"
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}

      - name: Run tests with coverage report output
        run: go test -cover -coverpkg=./... -coverprofile=coverage.out ./...

  race_test:
    name: Unit test (race detector)

    # The reader goroutine hands key presses to the read loop through a channel,
    # and Close and the interrupt handler stop it from other goroutines. That
    # hand-off is the same Go code on every operating system, so one Linux leg
    # watches it; a second platform would repeat it rather than cover more.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"

      - name: Run tests with the race detector
        run: go test -race ./...

  cross_build:
    name: Cross build (${{ matrix.goos }})

    # prompt's terminal handling is split by build tag into a Windows half and a
    # `!windows` half, which means every BSD compiles the same files macOS does
    # — and nothing was checking that they still compile at all. They are where
    # the unix half is least exercised: golang.org/x/term and go-isatty both
    # carry per-system files underneath it. A leg takes seconds and produces no
    # binary; what it catches is a dependency dropping a system the `!windows`
    # tag silently promises to support.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        goos: [freebsd, openbsd, netbsd]

    env:
      GOOS: ${{ matrix.goos }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"

      - name: Build
        run: go build ./...
