# Read by gremlins from the module root, locally and in the Mutation workflow.
unleash:
  threshold:
    # Exit with an error when killed / (killed + lived) is at or below this
    # percentage. It is set here rather than with --threshold-efficacy:
    # gremlins v0.6.0 does not read that flag's value. It applies to the lines
    # a pull request changes; the weekly run of the whole package passes its
    # own floor in a config file of its own (.github/workflows/mutation.yml).
    efficacy: 90
